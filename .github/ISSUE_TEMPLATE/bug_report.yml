name: Bug report
description: Something in Shortlist doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **don't paste personal data** (your CV, profile files, tracker rows or job links tied to you). Replace them with made-up examples.
        Security problems go through the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Shortlist version
      description: Settings shows it, or the installer's file name.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (built from source)
        - Linux (.deb, untested)
        - Other
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`, if the problem involves running a command.
  - type: textarea
    id: logs
    attributes:
      label: Error text or screenshot
      description: Optional. Check it for personal details first.
