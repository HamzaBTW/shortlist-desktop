appId: io.github.hamzabtw.shortlist
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - LICENSE
asar: true
# The fonts are under the SIL Open Font License, which asks for its text to ship with them.
extraResources:
  - from: src/renderer/src/assets/fonts
    to: licenses
    filter:
      - OFL-*.txt

# Turn off Electron features this app never uses, so they can't be abused.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}

mac:
  target: dmg
  category: public.app-category.productivity

# .deb only (Ubuntu, Debian, Mint). No AppImage: its launcher adds --no-sandbox where user
# namespaces are restricted (the Ubuntu 24.04+ default), so the app would start with the sandbox
# off. The .deb installs an AppArmor profile that keeps the sandbox on.
linux:
  target:
    - target: deb
      arch: x64
  category: Office
  # The .deb format needs a maintainer with an address; this is the GitHub no-reply one.
  maintainer: HamzaBTW <184725831+HamzaBTW@users.noreply.github.com>
