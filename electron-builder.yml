appId: io.github.hamzabtw.shortlist
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - LICENSE
asar: true
# The fonts are under the SIL Open Font License, which asks for its text to ship with them.
extraResources:
  - from: src/renderer/src/assets/fonts
    to: licenses
    filter:
      - OFL-*.txt

# Turn off Electron features this app never uses, so they can't be abused.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}

mac:
  target: dmg
  category: public.app-category.productivity

linux:
  target:
    - AppImage
    - deb
  category: Office
